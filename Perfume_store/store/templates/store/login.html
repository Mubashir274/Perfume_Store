
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login | Nostalgic Fragrance</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: #111;
            border: 1px solid #b89550;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.5);
        }

        .brand {
            text-align: center;
            color: #d6b46a;
            font-size: 25px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            color: #d6b46a;
            margin: 17px 0 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #d6b46a;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #c5a15b;
            color: #080808;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e2c17b;
        }

        .bottom-text {
            text-align: center;
            margin-top: 23px;
            color: #aaa;
            font-size: 14px;
        }

        a {
            color: #d6b46a;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .messages {
            background: #291b16;
            border: 1px solid #8c5439;
            color: #ffc4a5;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        @media(max-width: 480px) {
            .login-container {
                padding: 25px 20px;
            }

            .brand {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="brand">Nostalgic Fragrance</div>

    <h2>Welcome Back</h2>

    <p class="subtitle">
        Login to your customer account.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="messages">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input
            type="text"
            name="username"
            placeholder="Enter your username"
            value="{{ request.POST.username|default:'' }}"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">Login</button>
    </form>

    <div class="bottom-text">
        Don't have an account?
        <a href="{% url 'signup' %}">Create Account</a>
    </div>

    <div class="bottom-text">
        <a href="/">Back to Home</a>
    </div>

</div>

</body>
</html>
